---
layout: admin
permalink: /admin/
sitemap: false
lang: ukr
---

<div class="admin-app" data-admin data-repo="DanDanilyuk/ivanzelot" data-branch="main">
  <p class="admin-status hidden" data-status role="status"></p>

  <section class="admin-login" data-login>
    <div class="admin-card">
      <h1>Редактор</h1>
      <p class="admin-lead">Українською. Латинка-25 оновиться сама.</p>
      <form data-login-form action="javascript:void(0)" method="post" autocomplete="on" onsubmit="event.preventDefault(); if (window.adminLogin) { window.adminLogin(); } return false;">
        <label class="hidden" for="admin-username">Користувач</label>
        <input id="admin-username" name="username" type="text" value="editor" autocomplete="username" class="hidden" tabindex="-1">
        <label for="admin-password">Пароль</label>
        <input id="admin-password" name="password" data-password type="password" autocomplete="current-password" spellcheck="false">
        <p class="admin-help">
          {%- if jekyll.environment == 'production' -%}
          Пароль із менеджера паролів.
          {%- else -%}
          Локально: <code>password</code>
          {%- endif -%}
        </p>
        <button type="submit" data-login-btn>Увійти</button>
      </form>
    </div>
  </section>

  <section class="admin-shell hidden" data-shell>
    <aside class="admin-sidebar">
      <div class="admin-sidebar__bar">
        <input class="admin-search" data-search type="search" placeholder="Номер…" autocomplete="off">
        <button type="button" class="admin-btn admin-btn--quiet" data-new title="Новий вірш">Новий</button>
      </div>
      <div class="admin-list" data-list></div>
    </aside>
    <div class="admin-editor">
      <header class="admin-editor__bar">
        <p class="admin-path" data-path></p>
        <div class="admin-editor__actions">
          <button type="button" class="admin-btn" data-save>Зберегти</button>
          <button type="button" class="admin-btn admin-btn--danger hidden" data-delete>Видалити</button>
          <button type="button" class="admin-btn admin-btn--quiet" data-logout>Вийти</button>
        </div>
      </header>
      <div class="admin-row">
        <div>
          <label for="admin-number">Номер</label>
          <input id="admin-number" data-number>
        </div>
        <div>
          <label for="admin-edits">Правки</label>
          <input id="admin-edits" data-edits>
        </div>
      </div>
      <label for="admin-body">Текст українською</label>
      <textarea id="admin-body" data-body spellcheck="true"></textarea>
    </div>
  </section>
</div>
