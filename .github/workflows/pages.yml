name: Build and deploy site

# Builds the site with this repository's own Jekyll (4.x) and publishes it to
# GitHub Pages. GitHub's built-in Pages build is not used: it runs Jekyll 3.10
# via the github-pages gem, which this Gemfile no longer depends on.
#
# Requires the repository to be PUBLIC (Pages cannot publish a private repo on
# the free plan) and Settings > Pages > Source set to "GitHub Actions".
#
# The custom domain comes from the CNAME file in the repository root, which
# Jekyll copies into the built site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No ruby-version given: setup-ruby reads .ruby-version itself. Passing
      # ruby-version-file is not a valid input and only produces a warning.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # enablement: true turns Pages on and sets the source to Actions via the
      # API, so the site does not have to be enabled by hand in Settings.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          # Repository secrets, not variables. Variables are visible on a public repo.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
