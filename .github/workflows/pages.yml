name: Build and deploy site

# The repository is private, so GitHub Pages cannot publish it (that needs a
# paid plan). Instead this builds the site here and uploads the finished HTML
# to Cloudflare Pages, which serves ivanzelot.com. Cloudflare never needs
# access to the repository - only the built output is sent.
#
# Two repository secrets are required, under Settings > Secrets and variables
# > Actions:
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown in the Cloudflare dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=ivanzelot --branch=main
