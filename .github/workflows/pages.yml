name: Build and deploy site

# The repository is private, so GitHub Pages cannot publish it - that needs a
# paid plan. Instead this builds the site here and commits the result to the
# `deploy` branch, which Cloudflare Pages serves with no build step of its own.
#
# `deploy` is written as a single-commit orphan and force-pushed every run, so
# it never accumulates history. Cloudflare keeps its own deployment history.
#
# No secrets are needed: the automatic GITHUB_TOKEN can push the branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to push the deploy branch

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Publish built site to the deploy branch
        # git init runs INSIDE _site, so this is a throwaway repository: the
        # root .gitignore (which ignores _site) does not apply, and the source
        # history is never involved.
        run: |
          cd _site
          git init -q -b deploy
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
