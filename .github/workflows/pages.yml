name: Build and deploy site

# Builds the site with this repository's own Jekyll (4.x) and publishes it to
# GitHub Pages. GitHub's built-in Pages build is not used: it runs Jekyll 3.10
# via the github-pages gem, which this Gemfile no longer depends on.
#
# Requires the repository to be PUBLIC (Pages cannot publish a private repo on
# the free plan) and Settings > Pages > Source set to "GitHub Actions".
#
# The custom domain comes from the CNAME file in the repository root, which
# Jekyll copies into the built site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
